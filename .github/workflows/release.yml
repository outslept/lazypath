name: release

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  release-pr:
    name: release-plz → version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: release-plz release-pr
        id: rp
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: '0.4.3'
          config: release-plz.toml

  release:
    name: release-plz → tag + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      version: ${{ steps.rp.outputs.releases_created == 'true' && fromJSON(steps.rp.outputs.releases)[0].version || '' }}
      tag: ${{ steps.rp.outputs.releases_created == 'true' && fromJSON(steps.rp.outputs.releases)[0].tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: release-plz release
        id: rp
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: '0.4.3'
          config: release-plz.toml

  build:
    name: build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-pc-windows-gnu]
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup MinGW-w64 (GNU only)
        id: msys2
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Put MinGW-w64 on PATH (GNU only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }} --toolchain stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lazypath-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/lazypath.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attach binaries
    needs: [release, build]
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tag (CHANGELOG.md)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lazypath-*
          path: dist/raw
          merge-multiple: false

      - name: Stage dist + SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist
          for d in dist/raw/lazypath-*; do
            cp "$d/lazypath.exe" "dist/$(basename "$d").exe"
          done
          cd dist
          sha256sum lazypath-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/lazypath-*.exe'

      - name: Attach assets (keeps release-plz's changelog body)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/lazypath-*.exe
            dist/SHA256SUMS.txt
            CHANGELOG.md
