[package]
name = "lazypath"
version = "0.1.0"
edition = "2021"
description = "Minimalist TUI and CLI Windows PATH and environment variable auditor"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
